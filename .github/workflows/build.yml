#
# CI for the Ultraleap hands input provider.
#
# GitHub-hosted runners carry no Ultraleap SDK (LeapC), and the SDK is not
# fetched from anywhere public. So this workflow has two tiers:
#
#   1. NO-SDK tier (always runs, hosted runners):
#        - pin self-check (CMake pin == RUNTIME_REF here);
#        - configure WITHOUT the SDK and assert the "NOT BUILT" message;
#        - build + run the hardware-free mapping unit test;
#        - COMPILE-CHECK the provider sources against tests/leapc_stub
#          (-DULTRALEAP_USE_LEAPC_STUB=ON) and assert the single export.
#      The stub binary is DisplayXR-Ultraleap-STUBCHECK: never uploaded,
#      never packaged. A green run of this tier means "the sources still
#      compile and link against the pinned runtime", NOT "the provider works".
#
#   2. SDK tier (opt-in, self-hosted): builds the REAL provider + installer on a
#      runner labelled [self-hosted, windows, ultraleap-sdk] that has the
#      Ultraleap SDK installed. It only runs when the repository variable
#      ULTRALEAP_SDK_RUNNER is 'true' - without the gate, a job targeting a
#      label no runner carries stays `queued` forever, with no error.
#
# BILLING: these jobs build the runtime from source. Free while this repo is
# public. If it is ever made private, the macOS leg bills at 10x and the
# Windows legs at 2x against the org's shared Actions allowance - audit before
# flipping visibility (runtime CLAUDE.md, "Org Actions billing").

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the macOS compile-check leg"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # MUST equal DXR_RUNTIME_GIT_TAG in CMakeLists.txt (pin self-check below).
  # Exact pin: the provider's xrt_device is not ABI-versioned (runtime ADR-063).
  RUNTIME_REF: v2.69.3

jobs:
  pin:
    name: pin self-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: CMake pin == RUNTIME_REF == catalog range
        run: |
          set -euo pipefail
          cmake_tag=$(sed -n 's/^set(DXR_RUNTIME_GIT_TAG "\(v[0-9.]*\)".*/\1/p' CMakeLists.txt)
          test -n "$cmake_tag" || { echo "::error::could not read DXR_RUNTIME_GIT_TAG from CMakeLists.txt"; exit 1; }
          if [ "$cmake_tag" != "$RUNTIME_REF" ]; then
            echo "::error::pin drift: CMakeLists.txt has $cmake_tag, workflow RUNTIME_REF is $RUNTIME_REF. Bump both in one commit."
            exit 1
          fi
          python3 -I scripts/check_catalog.py catalog/ultraleap-hands.json --runtime-pin "$cmake_tag"
          echo "pin OK: $cmake_tag"

  linux:
    name: linux (no SDK + stub compile-check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout displayxr-runtime (pinned)
        uses: actions/checkout@v4
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: displayxr-runtime
      - name: Dependencies (the runtime's Linux build set)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libx11-dev libx11-xcb-dev libwayland-dev \
            libdbus-1-dev \
            libgl-dev libglvnd-dev libegl1-mesa-dev libxrandr-dev libxxf86vm-dev libxcb-glx0-dev
      - name: Configure without the SDK (must say NOT BUILT)
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDXR_RUNTIME_SOURCE_DIR="$PWD/displayxr-runtime" 2>&1 | tee configure.log
          grep -q "Ultraleap input provider: NOT BUILT - LeapC SDK not found" configure.log
      - name: Unit tests (hardware-free)
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Compile-check against the LeapC stub
        run: |
          set -euo pipefail
          echo "::warning::LeapC SDK absent: the provider is COMPILE-CHECKED against tests/leapc_stub only. This does not prove it works."
          cmake -S . -B build-stub -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDXR_RUNTIME_SOURCE_DIR="$PWD/displayxr-runtime" -DULTRALEAP_USE_LEAPC_STUB=ON
          cmake --build build-stub --target displayxr_ultraleap
      - name: Exactly one exported symbol
        run: |
          set -euo pipefail
          so=build-stub/src/ultraleap/DisplayXR-Ultraleap-STUBCHECK.so
          exports=$(nm -D --defined-only "$so" | awk '{print $3}')
          echo "$exports"
          test "$exports" = "xrtInputPluginNegotiate"

  windows:
    name: windows (stub compile-check)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout displayxr-runtime (pinned)
        uses: actions/checkout@v4
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: displayxr-runtime
      - name: Setup vcpkg (the runtime's manifest)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          # Same commit displayxr-leia-plugin pins; keep them aligned.
          vcpkgGitCommitId: '5d90b0d5d0317336e65662f2bf0d671b0902c632'
          vcpkgJsonGlob: 'displayxr-runtime/vcpkg.json'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install OpenXR loader
        shell: pwsh
        run: |
          # Loader .lib for the runtime subdirectory; same rev displayxr-leia-plugin uses.
          $v = "1.1.51"
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-$v/openxr_loader_windows-$v.zip" -OutFile openxr_loader.zip
          Expand-Archive -Path openxr_loader.zip -DestinationPath openxr_sdk -Force
      - name: Configure (LeapC stub)
        shell: pwsh
        run: |
          Write-Host "::warning::LeapC SDK absent: COMPILE-CHECK against tests/leapc_stub only. This does not prove the provider works."
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DDXR_RUNTIME_SOURCE_DIR="${{ github.workspace }}/displayxr-runtime" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/displayxr-runtime" `
            -DOpenXR_ROOT="${{ github.workspace }}/openxr_sdk" `
            -DULTRALEAP_USE_LEAPC_STUB=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
      - name: Build provider + unit test
        shell: pwsh
        run: |
          cmake --build build --config Release --target displayxr_ultraleap tests_ultraleap_map
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
      - name: One export; imports only the runtime DLL + system DLLs
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter DisplayXR-Ultraleap-STUBCHECK.dll | Select-Object -First 1
          if (-not $dll) { throw "stub DLL not found" }
          $names = (& dumpbin /nologo /exports $dll.FullName) |
            Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          Write-Host "exports: $names"
          if (@($names).Count -ne 1 -or $names -ne 'xrtInputPluginNegotiate') { throw "expected exactly one export, xrtInputPluginNegotiate" }
          # Recorded for docs/trunk-dependencies.md: which runtime-DLL symbols the
          # Windows provider really imports (u_log / u_var family expected).
          & dumpbin /nologo /imports $dll.FullName | Select-String -Pattern '^\s+\S+\.dll$|u_log|u_var' | ForEach-Object { $_.Line }

  macos:
    name: macos (stub compile-check)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout displayxr-runtime (pinned)
        uses: actions/checkout@v4
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: displayxr-runtime
          # git describe gives the runtime its version; it needs the tag.
          fetch-tags: true
      - name: Dependencies
        run: |
          brew install cmake ninja eigen
          brew install glslang molten-vk vulkan-headers vulkan-loader
      - name: Compile-check against the LeapC stub
        run: |
          set -euo pipefail
          echo "::warning::LeapC SDK absent: COMPILE-CHECK against tests/leapc_stub only."
          cmake -S . -B build-stub -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDXR_RUNTIME_SOURCE_DIR="$PWD/displayxr-runtime" -DULTRALEAP_USE_LEAPC_STUB=ON
          cmake --build build-stub --target displayxr_ultraleap tests_ultraleap_map
          ctest --test-dir build-stub --output-on-failure
          test "$(nm -gU build-stub/src/ultraleap/DisplayXR-Ultraleap-STUBCHECK.dylib | awk '{print $3}')" = "_xrtInputPluginNegotiate"

  sdk-windows:
    name: windows (REAL SDK, self-hosted)
    # Gate: see the header. Set the repository variable once a runner exists.
    if: vars.ULTRALEAP_SDK_RUNNER == 'true'
    runs-on: [self-hosted, windows, ultraleap-sdk]
    env:
      # The runner provides both: an Ultraleap SDK install and a runtime
      # checkout it keeps built (vcpkg + OpenXR loader). Neither is fetched.
      LEAPSDK_DIR: ${{ vars.ULTRALEAP_LEAPSDK_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout displayxr-runtime (pinned)
        uses: actions/checkout@v4
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: displayxr-runtime
      - name: Prepare the runtime checkout (vcpkg + OpenXR loader)
        shell: cmd
        run: |
          cd displayxr-runtime
          call scripts\build_windows.bat generate
      - name: Build provider + installer (unsigned)
        shell: cmd
        env:
          DXR_RUNTIME_SOURCE_DIR: ${{ github.workspace }}\displayxr-runtime
        run: call scripts\build-windows.bat all Release
      - name: Assert the real provider (not the stub) and its imports
        shell: pwsh
        run: |
          $dll = "_package\bin\plugins\DisplayXR-Ultraleap.dll"
          if (-not (Test-Path $dll)) { throw "no real provider DLL" }
          $deps = & dumpbin /nologo /dependents $dll
          $deps
          if (-not ($deps -match 'LeapC\.dll')) { throw "the provider does not import LeapC.dll - is this a stub build?" }
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayXR-Ultraleap-unsigned
          path: |
            _package/DisplayXRUltraleapSetup-*.exe
            _package/bin/plugins/DisplayXR-Ultraleap.dll
          if-no-files-found: error
